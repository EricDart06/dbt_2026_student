[project]
name = "byui-dbt-olist"
version = "0.1.0"
description = "Analytics engineering with dbt on the Olist e-commerce dataset"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-core>=1.10,<2.0",
    "dbt-snowflake>=1.10,<2.0",
]

[tool.uv]
# This is a dbt project, not a Python package: install the tools, don't build anything.
package = false
